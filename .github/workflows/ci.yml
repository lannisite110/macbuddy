name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      - name: Regression suite
        run: bash Scripts/perf/regression.sh
